<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<!-- CSP — post.html / write.html과 문자열이 같아야 한다(세 페이지가 한 정책).
     GitHub Pages는 HTTP 헤더를 못 바꾸므로 <meta>가 유일한 수단이다.
     인라인 <script> / <style> / style="…" / on*="…" / eval 을 전부 막는다.
     그래서 이 파일에는 인라인 코드가 한 줄도 없어야 한다. 테마 초기화도 js/theme-init.js로 뺐다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- 첫 페인트 전에 테마를 확정한다(FOUC 방지). 그래서 defer 없이 동기로 싣는다.
     'blogTheme' 문자열은 config.js의 storageKeys.theme과 반드시 같아야 한다. -->
<script src="js/theme-init.js"></script>

<title>메모 블로그</title>
<meta name="description" content="공부한 것을 기록하는 개인 학습 블로그.">
<meta name="color-scheme" content="light dark">
<!-- 파비콘 404 요청을 만들지 않기 위한 빈 아이콘 -->
<link rel="icon" href="data:,">

<!-- 로드 순서 고정: tokens → base → layout → components → prose (계약서 §11)
     animations.css는 v3.0에서 파일째 삭제됐다. 되살리지 말 것 — 404가 난다. -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/prose.css">

<!-- 목록 화면은 마크다운을 렌더하지 않는다(카드의 내용물은 분류·제목·날짜·태그 — 전부 index.json의 메타다).
     그래서 marked / DOMPurify / highlight.js 와 js/markdown.js는 여기서 로드하지 않는다 — 상세 페이지의 몫.
     ※ 목록이 언젠가 본문 일부를 마크다운으로 그리게 되면 markdown.js와 CDN 셋을 함께 올려야 한다. -->
<script defer src="js/config.js"></script>
<script defer src="js/util.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/admin.js"></script>
<script defer src="js/app.js"></script>
</head>

<body>
<!-- 인트로 전등 — index.html 전용, 세션당 1회(계약서 §3-5). <body> 첫 자식이어야 첫 페인트부터 본문을 덮는다.
     그림·시간표는 전부 CSS(components.css §16 / layout.css §10), 종료(hidden + sessionStorage)는 ui.js initIntro().
     v4.0(C4): 건너뛰기 버튼이 막의 마지막 자식이다. 포커스 가능한 자식이 있으므로 aria-hidden은 막이 아니라 장식인 전구에 붙는다.
     막이 떠 있는 동안 ui.js가 body의 다른 자식 전부에 inert를 붙인다 — 첫 Tab은 이 버튼, Esc도 같은 일을 한다. -->
<div class="intro" id="intro">
  <div class="intro-bulb" aria-hidden="true"></div>
  <button class="intro-skip" id="introSkip" type="button">건너뛰기</button>
</div>
<a class="sr-only" href="#main">본문 바로가기</a>

<!-- 헤더는 static이다. sticky도, 밑선도, 로고 마크도 없다(계약서 §3).
     햄버거는 첫 자식이다 — CSS가 흐름에서 빼 화면 왼쪽 끝(absolute)에 앉힌다. DOM 순서는 그대로라
     Tab 순서(햄버거 → 브랜드 → 내비 → 테마)는 변하지 않는다.
     아이콘은 CSS ::before가 그린다(테마 버튼과 같은 방식). 세 페이지(index / post / write) 마크업이 같아야 한다. -->
<header class="site-header">
  <button class="icon-btn side-toggle" id="sideToggle" type="button"
          aria-label="분류 메뉴 열기" aria-expanded="false" aria-controls="side"></button>
  <a class="brand" href="index.html"><span data-site-title>메모 블로그</span></a>
  <!-- 항목·순서는 세 페이지가 동일하다(계약서 §3-3, v4.0 2항목 — v3.9에 "소개", v4.0에 "태그"(#tags 폐기와 함께) 삭제).
       현재 페이지 표시는 클래스가 아니라 aria-current="page" — 이 페이지는 "글".
       "글"(쿼리 없는 index.html)은 ?cat= ?tags= 필터를 푸는 길이기도 하다 — 결과 줄의 "전체 글 보기"와 같은 곳이다(§4-5). -->
  <nav class="site-nav" aria-label="주요 메뉴">
    <a class="nav-link" href="index.html" aria-current="page">글</a>
    <a class="nav-link" href="write.html" data-admin-only hidden>쓰기</a>
  </nav>
  <button class="icon-btn" id="themeToggle" type="button" aria-label="테마 전환" aria-pressed="false"></button>
</header>

<!-- 사이드바 — 분류별 글 목록. 세 페이지 마크업이 바이트 단위로 같다(사양 B).
     문서 순서는 헤더 → 사이드바 → 본문. 열릴 때 포커스는 ui.js focusIntoSide()가 옮긴다(계약서 §3-2).
     #sideTree는 ui.js renderSide()가 채운다.
     열림·고정 상태는 <body> 클래스(side-open / side-pinned)로, ui.js가 붙인다. -->
<aside class="side" id="side" aria-label="분류별 글 목록">
  <div class="side-head">
    <span class="side-title">분류</span>
    <button class="icon-btn side-pin" id="sidePin" type="button"
            aria-label="사이드바 고정" aria-pressed="false"></button>
    <button class="icon-btn side-close" id="sideClose" type="button" aria-label="닫기"></button>
  </div>
  <nav class="side-tree" id="sideTree"></nav>
</aside>
<!-- 오버레이 모드에서만 보인다(고정 도킹이면 스크림 없음). hidden 토글은 ui.js 몫. -->
<div class="side-scrim" id="sideScrim" hidden></div>

<!-- tabindex="-1"은 스킵 링크의 착지점이다. 없으면 스크롤만 되고 포커스는 헤더에 남는다(계약서 §3-1).
     list-page: 목록만 폭을 넓힌다(--w-page). 카드 그리드가 2~3열이 되려면 720px로는 모자란다. -->
<main class="site-main list-page" id="main" tabindex="-1">

  <!-- DOM 순서 = 시선 순서 = Tab 순서: 정체 → 찾기(검색) → 결과 줄 → 목록 (계약서 §4, v4.0).
       분류는 화면에서 사라진 것이 아니라 왼쪽 사이드바로 옮겨 갔다 — 햄버거가 첫 Tab 정지점이라 순서상 여전히 검색 앞이다.
       v3.4 머리말은 제목 + 검색, 가운데 정렬. 부제(.page-sub)는 사용자 요청으로 폐기됐다. -->
  <div class="page-head">
    <h1 class="page-title" data-site-title>메모 블로그</h1>
    <!-- 검색은 <h1>의 다음 자식. "고정"은 sticky가 아니라 자리 고정이다(§4-2) — 어디서든 "/"가 여기로 데려온다.
         v4.0(M2): placeholder의 가운뎃점 나열과 "( / )"를 뺐다. 단축키는 aria-keyshortcuts와 키캡(.search-key)이 말한다.
         순서 고정: input → kbd → 지우기 버튼(CSS가 input의 상태를 + 결합자로 읽는다). -->
    <div class="search">
      <label class="sr-only" for="searchInput">글 검색</label>
      <input class="search-input" id="searchInput" type="search"
             placeholder="제목이나 태그로 찾기"
             aria-keyshortcuts="/" autocomplete="off" enterkeyhint="search">
      <kbd class="search-key" aria-hidden="true">/</kbd>
      <button class="search-clear" type="button" aria-label="검색어 지우기" hidden></button>
    </div>
  </div>

  <!-- v3.9: 분류 인덱스 행(#catRow)은 폐기. v4.0: 태그 인덱스(<details id="tags">)도 폐기 — 사용자 판정
       "홈 화면에 게시글 바로 위에 존재하는 태그 카테고리 지워"(계약서 §4-3). 분류는 사이드바가, 태그 필터(?tags=)는 상세의 태그 링크가 건다. -->

  <!-- 결과 줄(계약서 §4-5) — 몇 편이 어떤 조건으로 보이는지 한 문장 + 필터가 걸렸을 때만 "전체 글 보기".
       live 영역은 .list-status 하나다(role="status"). #postList에는 aria-live를 붙이지 않는다 — 필터마다 카드 전량이 낭독됐다(C1).
       hidden으로 시작한다. 로드·0편·오류에는 app.js가 줄째 감춘다. -->
  <div class="list-bar" id="listBar" hidden>
    <p class="list-status" id="listStatus" role="status"></p>
    <button class="list-reset" id="listReset" type="button" hidden>전체 글 보기</button>
  </div>

  <!-- CSP(style-src 'self')가 인라인 <style>을 막으므로 noscript 안에 숨김 규칙을 둘 수 없다.
       대신 #listLoading을 hidden으로 시작시키고 app.js가 켠다 — JS가 꺼져 있으면 영영 켜지지 않으니
       "불러오는 중"이 이 안내와 같이 보이는 일이 없다. -->
  <noscript>
    <div class="list-empty">
      <p><strong>자바스크립트가 꺼져 있습니다</strong></p>
      <p>이 블로그는 글 목록을 자바스크립트로 불러옵니다. 브라우저 설정에서 자바스크립트를 켜 주세요.</p>
    </div>
  </noscript>

  <!-- 첫 렌더 300ms 뒤 app.js가 data-ready=""를 붙인다. 그 뒤 필터로 다시 그려지는 카드는 arrive 없음(계약서 §4-4·§11-4).
       data-cats(글이 있는 분류의 수)도 app.js가 붙인다 — "1"이면 CSS가 카드의 분류 라벨을 감춘다(§4-4). aria-live 없음(§4-5). -->
  <div class="post-list" id="postList"></div>

  <!-- hidden으로 시작한다. app.js start()가 fetch 직전에 켜고, 로드가 끝나면 다시 끈다. -->
  <p class="list-loading" id="listLoading" hidden>불러오는 중…</p>

  <div class="list-empty" id="listEmpty" hidden></div>

</main>

<footer class="site-footer">
  <p class="footer-note">&copy; 이 사이트는 학습 블로그를 목적으로 바이브 코딩 제작하였습니다</p>
  <p class="footer-note">게시글은 모두 직접 작성하고 정리하였습니다</p>
  <p class="footer-meta"><span data-year>2026</span></p>
</footer>

<div class="toast-area" id="toastArea" aria-live="polite"></div>
</body>
</html>
