<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<!-- CSP — index.html / write.html과 문자열이 같아야 한다(세 페이지가 한 정책).
     GitHub Pages는 HTTP 헤더를 못 바꾸므로 <meta>가 유일한 수단이다.
     인라인 <script> / <style> / style="…" / on*="…" / eval 을 전부 막는다.
     본문 마크다운이 살균을 뚫더라도 인라인 핸들러·javascript: 링크는 여기서 한 번 더 막힌다.
     img-src에 https:·data:를 두는 이유 — 글의 이미지는 외부 호스팅일 수 있다(살균기가 src 스킴은 검사한다). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- 첫 페인트 전에 테마를 확정한다(FOUC 방지). 그래서 defer 없이 동기로 싣는다.
     'blogTheme' 문자열은 config.js의 storageKeys.theme과 반드시 같아야 한다. -->
<script src="js/theme-init.js"></script>

<title>글 · 메모 블로그</title>
<meta name="description" content="공부한 내용을 정리한 글.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<!-- 로드 순서 고정: tokens → base → layout → components → prose (계약서 §11)
     highlight.js의 테마 CSS는 로드하지 않는다. 코드블록 배색은 prose.css가 토큰으로 직접 그린다.
     animations.css는 v3.0에서 파일째 삭제됐다. -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/prose.css">

<!-- CDN 고정 버전 — config.js의 cdn 값과 일치시킨다.
     defer 스크립트는 문서 순서대로 실행되므로 라이브러리가 항상 먼저 준비된다.
     integrity(SRI): CDN이 오염되면 브라우저가 스크립트를 아예 실행하지 않는다.
     살균기(DOMPurify) 자체가 바꿔치기당하면 다른 방어가 전부 무의미해지므로 버전과 함께 내용도 고정한다.
     **버전을 올리면 해시도 반드시 같이 갱신한다** — 안 하면 스크립트가 통째로 차단된다. -->
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"
        integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"
        integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script defer src="js/config.js"></script>
<script defer src="js/util.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/markdown.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/admin.js"></script>
<script defer src="js/post.js"></script>
</head>

<body>
<!-- 계약서 §3-1: 세 페이지 모두 #main으로 간다. #postBody는 렌더 전에는 빈 컨테이너다. -->
<a class="sr-only" href="#main">본문 바로가기</a>

<!-- 햄버거는 첫 자식이다 — CSS가 흐름에서 빼 화면 왼쪽 끝(absolute)에 앉힌다. DOM 순서는 그대로다.
     아이콘은 CSS ::before가 그린다. 헤더·사이드바 마크업은 index.html과 같다(내비 aria-current만 다르다). -->
<header class="site-header">
  <button class="icon-btn side-toggle" id="sideToggle" type="button"
          aria-label="분류 메뉴 열기" aria-expanded="false" aria-controls="side"></button>
  <a class="brand" href="index.html"><span data-site-title>메모 블로그</span></a>
  <!-- 2항목(글 · 쓰기) — v3.9에 "소개", v4.0에 "태그"(#tags 폐기와 함께) 삭제(계약서 §3-3).
       이 페이지에는 aria-current="page"가 없다 — 글 한 편은 목록이 아니다. 돌아가는 길은 .back-link("목록")가 맡는다. -->
  <nav class="site-nav" aria-label="주요 메뉴">
    <a class="nav-link" href="index.html">글</a>
    <a class="nav-link" href="write.html" data-admin-only hidden>쓰기</a>
  </nav>
  <button class="icon-btn" id="themeToggle" type="button" aria-label="테마 전환" aria-pressed="false"></button>
</header>

<!-- 사이드바 — 분류별 글 목록. 세 페이지 마크업이 바이트 단위로 같다(사양 B).
     문서 순서는 헤더 → 사이드바 → 본문. 열릴 때 포커스는 ui.js focusIntoSide()가 옮긴다(계약서 §3-2).
     #sideTree는 ui.js renderSide()가 채운다.
     열림·고정 상태는 <body> 클래스(side-open / side-pinned)로, ui.js가 붙인다. -->
<aside class="side" id="side" aria-label="분류별 글 목록">
  <div class="side-head">
    <span class="side-title">분류</span>
    <button class="icon-btn side-pin" id="sidePin" type="button"
            aria-label="사이드바 고정" aria-pressed="false"></button>
    <button class="icon-btn side-close" id="sideClose" type="button" aria-label="닫기"></button>
  </div>
  <nav class="side-tree" id="sideTree"></nav>
</aside>
<!-- 오버레이 모드에서만 보인다(고정 도킹이면 스크림 없음). hidden 토글은 ui.js 몫. -->
<div class="side-scrim" id="sideScrim" hidden></div>

<!-- tabindex="-1"은 스킵 링크의 착지점이다. 없으면 스크롤만 되고 포커스는 헤더에 남는다(계약서 §3-1).
     본문 폭은 그대로다(list-page 없음) — 읽기 폭은 넓어질수록 나빠진다. -->
<main class="site-main" id="main" tabindex="-1">

  <!-- 탈출구는 .post 밖에 둔다. CDN이 막혀 post.js가 .is-loading을 떼지 못해도 살아 있어야 한다.
       v4.0(M2): "←" 문자를 뺐다 — 방향 쐐기는 CSS ::before가 선으로 그린다(계약서 §5, 원칙 7의 유일한 예외). -->
  <a class="back-link" href="index.html">목록</a>

  <!-- is-loading은 post.js가 렌더를 마치면 떼어낸다. 빈 머리말이 깜빡이는 것을 막기 위함. -->
  <article class="post is-loading" id="post">
    <header class="post-head">
      <h1 class="post-title" id="postTitle">글을 불러오는 중…</h1>
      <p class="post-summary" id="postSummary"></p>

      <!-- 순서 고정: 날짜 줄 → 분류·태그 줄 (계약서 §5).
           구분자는 없다(v4.0) — "게시"·"수정" 라벨과 간격이 경계다. created와 같은 날이면 post.js가 #postUpdated에 hidden을 붙인다. -->
      <p class="post-dates">
        <time class="post-date" id="postDate"></time>
        <time class="post-updated" id="postUpdated" hidden></time>
      </p>

      <div class="post-meta">
        <!-- 분류는 같은 분류의 목록으로 가는 유일한 경로라 <a>다(계약서 §5-3). -->
        <a class="post-cat" id="postCat" href="index.html"></a>
        <ul class="post-tags" id="postTags"></ul>
      </div>
    </header>

    <!-- h2가 3개 미만이면 post.js가 계속 감춰 둔다. 그래서 시작 상태도 hidden이다(계약서 §5-4).
         v3.7 #76: <details>로 접힌다 — 폰에서는 접힌 한 줄로, 768px 이상은 post.js가 open을 붙여 펼친 채 시작한다. -->
    <details class="toc" id="toc" hidden>
      <summary class="toc-title">목차</summary>
      <nav class="toc-list" aria-label="본문 목차"></nav>
    </details>

    <!-- 요약 카드 .post-recap은 여기(.toc 다음·.prose 앞)에 post.js mountRecap()이 끼운다(계약서 §5-7-2). 정적 마크업 없음. -->

    <div class="prose" id="postBody"></div>

    <footer class="post-foot">
      <!-- data-admin-only는 정적 hidden과 짝(계약서 §3·§8-2). admin.js apply()가 관리자일 때만 뗀다. -->
      <a class="btn" id="postEdit" href="write.html" data-admin-only hidden>수정</a>
    </footer>

    <!-- 연관 글(계약서 §5-8). 글을 다 읽은 자리에서 시간순 이웃(.post-nav)보다 먼저 온다.
         카드는 목록의 .entry를 그대로 쓴다(U.entryCard). 점수 > 0인 글이 없으면 post.js가 hidden을 두고
         "연관 글이 없습니다" 같은 문구는 두지 않는다. -->
    <section class="post-related" id="postRelated" aria-labelledby="postRelatedTitle" hidden>
      <h2 class="post-related-title" id="postRelatedTitle">연관 글</h2>
      <ul class="entry-list" id="postRelatedList"></ul>
    </section>

    <nav class="post-nav" id="postNav" aria-label="이전 글과 다음 글" hidden></nav>
  </article>

  <!-- 없는 글 id · 네트워크 실패 · file:// 접근 — post.js가 문구를 바꿔 끼운다.
       JS가 문구를 채우지 못하더라도 목록으로 돌아갈 길은 마크업에 남겨 둔다. -->
  <div class="post-error" id="postError" hidden>
    <p><strong>글을 찾을 수 없습니다</strong></p>
    <p>주소의 글 id가 바뀌었거나 파일이 아직 posts/&lt;분류&gt;/ 폴더에 없을 수 있습니다.</p>
    <a class="btn" href="index.html">목록으로 돌아가기</a>
  </div>

  <noscript>
    <div class="post-error">
      <p><strong>자바스크립트가 꺼져 있습니다</strong></p>
      <p>본문은 마크다운 파일을 읽어 그립니다. 브라우저 설정에서 자바스크립트를 켜 주세요.</p>
      <a class="btn" href="index.html">목록으로 돌아가기</a>
    </div>
  </noscript>

</main>

<footer class="site-footer">
  <p class="footer-note">&copy; 이 사이트는 학습 블로그를 목적으로 바이브 코딩 제작하였습니다</p>
  <p class="footer-meta"><span data-year>2026</span></p>
</footer>

<div class="toast-area" id="toastArea" aria-live="polite"></div>
</body>
</html>
