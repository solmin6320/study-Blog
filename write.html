<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<!-- CSP — index.html / post.html과 문자열이 같아야 한다(세 페이지가 한 정책).
     인라인 <script> / <style> / style="…" / on*="…" 을 전부 막는다.
     그래서 이 파일에는 인라인 코드가 한 줄도 없어야 한다. 테마 초기화도 js/theme-init.js로 뺐다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- 첫 페인트 전에 테마를 확정한다(FOUC 방지). 그래서 defer 없이 동기로 싣는다.
     'blogTheme' 문자열은 config.js의 storageKeys.theme과 반드시 같아야 한다. -->
<script src="js/theme-init.js"></script>

<title>새 글 쓰기 · 메모 블로그</title>
<meta name="description" content="마크다운으로 글을 쓰고 .md와 index.json 파일로 내보내는 작성 도구.">
<meta name="color-scheme" content="light dark">
<!-- 작성 도구는 검색 결과에 뜰 이유가 없다(공개돼도 무해하지만 색인은 불필요). -->
<meta name="robots" content="noindex, nofollow">
<!-- 파비콘 404 요청을 만들지 않기 위한 빈 아이콘 -->
<link rel="icon" href="data:,">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<!-- 로드 순서 고정: tokens → base → layout → components → prose  (계약서 §11 — 5개다)
     여섯 번째 애니메이션 파일은 v3.0에서 파일째 삭제됐다. 여기에 <link>를 되살리면 404가 난다.
     highlight.js의 테마 CSS는 로드하지 않는다. 코드블록 배색은 prose.css가 토큰으로 직접 그린다. -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/prose.css">

<!-- 미리보기는 post.html과 똑같은 경로(marked → DOMPurify → highlight.js)로 그려야
     "보이는 대로 저장된다"가 성립한다. 그래서 상세 페이지와 같은 고정 버전을 그대로 싣는다.
     CDN 버전은 config.js의 cdn 값과 일치시킨다.
     defer 스크립트는 문서 순서대로 실행되므로 라이브러리가 항상 먼저 준비된다.

     integrity(SRI): 받은 파일의 해시가 다르면 브라우저가 실행 자체를 거부한다.
     살균기(DOMPurify)까지 CDN에서 받아 오는 구조라, CDN이 오염되면 살균기가 먼저 무력화된다.
     그래서 버전 고정만으로는 부족하고 해시까지 고정한다.
     ⚠ 버전을 올리면 해시도 반드시 함께 갱신한다(안 하면 스크립트가 통째로 로드되지 않는다).
     해시는 아래 버전의 파일에서 직접 계산한 sha384 값이며 post.html과 같아야 한다. -->
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"
        integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"
        integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<!-- 의존 순서: config → util → store → markdown → ui → admin → editor -->
<script defer src="js/config.js"></script>
<script defer src="js/util.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/markdown.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/admin.js"></script>
<script defer src="js/editor.js"></script>
</head>

<body>
<a class="sr-only" href="#main">본문 바로가기</a>

<!-- 계약서 §3: 헤더는 static이고 덩이는 넷(햄버거 · 브랜드 · 내비 · 테마 버튼)뿐이다.
     배경 3층 / 헤더 id / 로고 마크 / 액션 래퍼 + "새 메모" 버튼은 v3.0에서 전부 폐기됐다.
     햄버거는 첫 자식이다 — 사이드바가 왼쪽에서 나오므로 여는 버튼도 왼쪽 끝에 있어야 한다.
     아이콘은 CSS ::before가 그린다(테마 버튼과 같은 방식). 세 페이지 마크업이 같아야 한다.
     테마 버튼은 .site-header의 "직계" 자식이어야 한다 —
     layout.css의 `.site-header > .icon-btn { margin-inline-start:auto }`가 그걸 전제로 한다. -->
<header class="site-header">
  <button class="icon-btn side-toggle" id="sideToggle" type="button"
          aria-label="분류 메뉴 열기" aria-expanded="false" aria-controls="side"></button>
  <a class="brand" href="index.html"><span data-site-title>메모 블로그</span></a>
  <!-- index.html / post.html과 항목을 맞춘다. 페이지마다 메뉴가 달라 보이면 안 된다. -->
  <nav class="site-nav" aria-label="주요 메뉴">
    <a class="nav-link" href="index.html">글</a>
    <a class="nav-link is-active" href="write.html" data-admin-only>쓰기</a>
  </nav>
  <button class="icon-btn" id="themeToggle" type="button" aria-label="테마 전환" aria-pressed="false"></button>
</header>

<!-- 사이드바 — 분류별 글 목록. 세 페이지 마크업이 바이트 단위로 같다(사양 B).
     <header> 뒤·<main> 앞에 두는 이유: Tab 순서가 햄버거 → 사이드바 → 본문이 되어야
     열자마자 다음 Tab이 사이드바 안으로 들어간다. #sideTree는 ui.js renderSide()가 채운다.
     열림·고정 상태는 <body> 클래스(side-open / side-pinned)로, ui.js가 붙인다. -->
<aside class="side" id="side" aria-label="분류별 글 목록">
  <div class="side-head">
    <span class="side-title">분류</span>
    <button class="icon-btn side-pin" id="sidePin" type="button"
            aria-label="사이드바 고정" aria-pressed="false"></button>
    <button class="icon-btn side-close" id="sideClose" type="button" aria-label="닫기"></button>
  </div>
  <nav class="side-tree" id="sideTree"></nav>
</aside>
<!-- 오버레이 모드에서만 보인다(고정 도킹이면 스크림 없음). hidden 토글은 ui.js 몫. -->
<div class="side-scrim" id="sideScrim" hidden></div>

<!-- tabindex="-1": 스킵 링크(#main)의 착지점. 이게 없으면 브라우저에 따라 스크롤만 되고
     포커스는 헤더에 남아 다음 Tab이 다시 로고로 돌아간다(계약서 §3-1). 착지점 포커스 링은 base.css가 끈다.

     .editor-page(계약서 §6): 읽는 화면의 칼럼은 --w-prose(720px) 하나지만, 이 화면은
     좌우 분할이 목적이라 720px 안에서는 두 칸이 각각 340px가 되어 쓸 수 없다.
     이 클래스가 여기서만 기준선을 76rem으로 푼다. write.html의 <main> 외에는 쓰지 않는다. -->
<main class="site-main editor-page" id="main" tabindex="-1">

  <!-- 배포 도메인(관리자 판정 false)에서는 editor.js가 아래 .editor를 DOM에서 통째로 지우고
       이 문단의 hidden만 푼다. 에디터는 초기화조차 하지 않는다 — 자동저장·단축키·beforeunload도 붙지 않는다.
       사용자 요구: 배포 버전은 보기만 가능해야 한다. 글은 posts/ 폴더에 넣어 커밋하는 것이 유일한 경로다.
       (판정은 hostname 하나다 — js/admin.js. 쿼리·localStorage로 켜는 길은 없다.) -->
  <div class="editor-visitor" id="editorVisitor" hidden>
    <p>이 페이지는 로컬에서만 동작합니다. 글은 posts/ 폴더에 넣어 배포합니다. <a href="index.html">글 목록으로</a></p>
  </div>

  <noscript>
    <!-- 에디터는 전부 자바스크립트다. 꺼져 있으면 빈 입력칸만 남아 이유를 알 수 없다. -->
    <div class="editor-visitor">
      <p><strong>자바스크립트가 꺼져 있어요</strong></p>
      <p>미리보기 · 임시저장 · 파일 내보내기가 모두 자바스크립트로 동작합니다.
         브라우저 설정에서 자바스크립트를 켜고 새로고침해 주세요.</p>
    </div>
  </noscript>

  <div class="editor">
    <div class="editor-head">
      <label class="sr-only" for="fTitle">제목</label>
      <input class="editor-title" id="fTitle" type="text" placeholder="제목" title="제목"
             autocomplete="off" spellcheck="false" maxlength="120">

      <!-- 수정 모드(?id=)에서만 editor.js가 문구를 채우고 hidden을 푼다.
           게시일(created)이 보존된다는 사실을 화면에서 확인할 수 있어야 한다. -->
      <p class="editor-mode" id="editorMode" hidden></p>

      <!-- 분류 = 글이 실제로 들어갈 폴더(posts/<slug>/). 계약서 §9-3.
           목록은 posts/categories.json에서 온다. 그 파일이 비어 있거나 아예 없어도 에디터는
           끝까지 동작해야 한다 — 분류는 사용자가 직접 만드는 것이고, 시작은 0개다.
           editor.js가 "빈 목록 + 새 분류 버튼"만으로 글을 끝까지 쓸 수 있게 만든다. -->
      <div class="cat-picker">
        <label class="sr-only" for="fCategory">분류 (글이 저장될 폴더)</label>
        <select class="field" id="fCategory" title="분류 — posts/&lt;폴더명&gt;/ 에 저장됩니다"></select>
        <button class="btn btn-ghost" type="button" id="btnNewCat"
                aria-expanded="false" aria-controls="catNew">+ 새 분류</button>
      </div>

      <!-- 표시 이름과 폴더명을 나눠 받는다. 한글 이름은 폴더명이 될 수 없어서
           slug는 사용자가 영문으로 직접 짓는다(비면 editor.js가 막는다). -->
      <div class="cat-new" id="catNew" hidden role="group" aria-label="새 분류 만들기">
        <!-- 계약서 §6: 폴더명(slug)은 되돌릴 수 없는 결정이라 경고가 입력칸보다 "먼저" 와야 한다.
             title= 툴팁은 마우스에서만 뜨므로 터치·스크린리더 사용자에게는 없는 것과 같다.
             그래서 화면 문구로 내놓고, 폴더명 칸의 aria-describedby로도 연결해 포커스 때 읽히게 한다. -->
        <p class="cat-new-hint" id="catNewHint">
          폴더명은 <strong>한 번 정하면 바꾸지 않는다.</strong> 영문 소문자·숫자·하이픈만.
        </p>

        <label class="sr-only" for="fNewCatName">새 분류 표시 이름</label>
        <input class="field" id="fNewCatName" type="text" placeholder="표시 이름 (예: 알고리즘)"
               title="새 분류 표시 이름" autocomplete="off" maxlength="40">

        <label class="sr-only" for="fNewCatSlug">새 분류 폴더명 (영문 소문자·숫자·하이픈)</label>
        <!-- inputmode="latin"은 HTML 표준에 없는 값이라 어떤 브라우저도 해석하지 않았다(= 아무 효과 없음).
             표준 안에서 같은 목적에 가장 가까운 것은 autocapitalize="none"이다 —
             모바일 키보드가 첫 글자를 대문자로 바꾸는 것을 막아 준다(폴더명은 소문자만 허용).
             "영문으로 쓰라"는 안내는 키보드 속성이 아니라 .cat-new-hint와 placeholder가 맡는다.
             값 검사는 editor.js의 SLUG_RE가 하고, 틀리면 이유를 토스트로 말해 준다. -->
        <input class="field" id="fNewCatSlug" type="text" placeholder="폴더명 (영문: algorithm)"
               title="폴더명 — posts/&lt;폴더명&gt;/ 이 됩니다. 영문 소문자·숫자·하이픈만"
               aria-describedby="catNewHint"
               autocomplete="off" spellcheck="false" autocapitalize="none">

        <!-- 분류 기본 메모지 색 셀렉트는 계약서 v3.0 §9-2에서 폐기됐다.
             카드가 사라져 색이 놓일 면이 없다. 되살리지 않는다. -->
        <button class="btn" type="button" id="btnAddCat">추가</button>
        <button class="btn btn-ghost" type="button" id="btnCancelCat">취소</button>
      </div>

      <div class="editor-fields">
        <label class="sr-only" for="fSummary">한 줄 요약</label>
        <input class="field" id="fSummary" type="text" placeholder="한 줄 요약" title="한 줄 요약"
               autocomplete="off" maxlength="160">

        <label class="sr-only" for="fTags">태그 (쉼표로 구분)</label>
        <input class="field" id="fTags" type="text" placeholder="태그: css, 레이아웃"
               title="태그 (쉼표로 구분)" autocomplete="off">

        <label class="sr-only" for="fId">파일 id (파일명으로 쓰입니다)</label>
        <input class="field" id="fId" type="text" placeholder="파일 id (제목에서 자동 생성)"
               title="파일 id — posts/&lt;분류&gt;/&lt;id&gt;.md 의 파일명이 됩니다"
               autocomplete="off" spellcheck="false">

        <!-- 메모지 색 셀렉트는 계약서 v3.0 §9-2에서 폐기됐다.
             목록이 카드에서 텍스트 리스트로 바뀌어 색이 놓일 면이 없어졌고,
             제목 열을 훑는 시선을 색이 좌우로 흩는다. frontmatter에도 더 이상 쓰지 않는다. -->

        <label class="switch">
          <input type="checkbox" id="fPinned"><span class="switch-ui" aria-hidden="true"></span>고정
        </label>
      </div>

      <div class="editor-actions">
        <button class="btn" type="button" id="btnPreviewToggle" title="나란히 · 작성만 · 미리보기만 전환">미리보기</button>
        <button class="btn btn-primary" type="button" id="btnExport"
                title="파일로 내보내기 (Ctrl+S)" aria-keyshortcuts="Control+S">파일로 내보내기</button>
      </div>

      <!-- 내보내지 않은 변경이 있으면 editor.js가 .is-dirty를 붙인다. -->
      <p class="editor-status" id="editorStatus" role="status" aria-live="polite">준비 중…</p>
    </div>

    <div class="editor-split" id="editorSplit" data-mode="split">
      <div class="editor-pane">
        <!-- role="toolbar": 버튼 10개를 하나의 탭 스톱으로 묶는다. 안에서는 좌우 화살표로 옮긴다
             (editor.js의 roving tabindex와 짝이다 — 한쪽만 바꾸면 안내와 동작이 어긋난다).
             예전에는 버튼마다 탭 스톱이라 제목칸에서 본문까지 Tab을 11번 눌러야 했다. -->
        <div class="md-toolbar" id="mdToolbar" role="toolbar" aria-label="마크다운 서식">
          <button class="md-btn" type="button" data-md="bold" aria-label="굵게" title="굵게 (Ctrl+B)" aria-keyshortcuts="Control+B">B</button>
          <button class="md-btn" type="button" data-md="italic" aria-label="기울임" title="기울임 (Ctrl+I)" aria-keyshortcuts="Control+I">I</button>
          <button class="md-btn" type="button" data-md="heading" aria-label="제목" title="제목">H2</button>
          <button class="md-btn" type="button" data-md="link" aria-label="링크" title="링크">링크</button>
          <button class="md-btn" type="button" data-md="code" aria-label="인라인 코드" title="인라인 코드">코드</button>
          <button class="md-btn" type="button" data-md="codeblock" aria-label="코드 블록" title="코드 블록">코드블록</button>
          <button class="md-btn" type="button" data-md="list" aria-label="목록" title="목록">목록</button>
          <button class="md-btn" type="button" data-md="quote" aria-label="인용" title="인용">인용</button>
          <button class="md-btn" type="button" data-md="table" aria-label="표" title="표">표</button>
          <button class="md-btn" type="button" data-md="hr" aria-label="구분선" title="구분선">구분선</button>
        </div>

        <label class="sr-only" for="fBody">본문 (마크다운)</label>
        <!-- 탈출 방법을 모르면 없는 기능이다(T3-1 · WCAG 2.1.2).
             Tab은 여기서 들여쓰기로 쓰이므로, 포커스를 밖으로 빼는 방법을 반드시 알려야 한다.
             placeholder는 글을 쓰기 시작하면 사라지므로 세 겹으로 안내한다:
               ① placeholder(빈 화면)  ② 아래 숨은 설명(aria-describedby · 스크린리더)
               ③ 첫 Tab 때 #editorStatus에 뜨는 안내(editor.js의 teachTab) -->
        <p class="sr-only" id="bodyHint">Tab은 들여쓰기입니다. 포커스를 다음 항목으로 옮기려면 Esc를 누른 뒤 Tab을 누르세요. Ctrl+B 굵게, Ctrl+I 기울임, Ctrl+S 파일로 내보내기.</p>
        <textarea class="editor-area" id="fBody" spellcheck="false" autocomplete="off"
                  aria-describedby="bodyHint"
                  title="Tab = 들여쓰기 · Esc 다음 Tab = 다음 항목으로 이동"
                  placeholder="여기에 마크다운으로 씁니다. Tab은 들여쓰기(빠져나가려면 Esc 누른 뒤 Tab), Ctrl+B 굵게, Ctrl+S 내보내기."></textarea>
      </div>

      <!-- 미리보기는 상세 페이지와 같은 .prose 안에서 그린다. 여기 보이는 모습이 곧 글의 모습이다. -->
      <div class="preview-pane" role="region" aria-label="미리보기">
        <div class="prose" id="preview"></div>
      </div>
    </div>
  </div>
